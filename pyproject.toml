[project]
name = "remindbot"
version = "1.0.0"
description = "Reminder bot for Telegram and Discord. The logic is tested on its own; restarts lose nothing."
requires-python = ">=3.10"
dependencies = ["python-telegram-bot[job-queue]>=21", "discord.py>=2.3", "tzdata"]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["remindbot", "adapters"]
